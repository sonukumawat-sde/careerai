name: careerai
description: "CareerAI - Your Personal AI Career Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  http: ^1.2.0
  path_provider: ^2.1.2
  open_filex: ^4.4.0

  # Navigation
  go_router: ^17.4.0

  # Backend - Supabase (Auth + DB + Storage + Edge Functions)
  supabase_flutter: ^2.8.0

  # Networking
  dio: ^5.7.0

  # Local storage / offline cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Error handling
  fpdart: ^1.1.0

  # UI
  google_fonts: ^8.2.1

  # File pick (resume upload)
  file_picker: ^12.0.0-beta.7

  # Payments (baad me use karenge)
  purchases_flutter: ^10.9.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  syncfusion_flutter_pdf: ^34.1.33
  flutter_pdfview: ^1.3.2
  share_plus: ^13.0.0
  confetti: ^0.8.0
  image_picker: ^1.2.3
  google_sign_in: ^7.1.0
  purchases_ui_flutter: ^10.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/images/
    - assets/branding/

# App Icon config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true 